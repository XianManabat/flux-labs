<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Flux Labs</title>
    </head>
    <body>
        
        <h3>Registration form</h3>
        <form action="/register" method="POST" >
            <input type="text" name="username">username</input>
            <input type="text" name="email">Email</input>
            <input type="text" name="phone_number">Phone Number</input>
            <input type="password" name="password">password</input>
            <button type="submit" name="register">Register</button>
        </form>

        <h3>Log in form</h3>
        <form action="/login" method="POST" >
            <input type="text" name="username">username</input>
            <input type="password" name="password">password</input>
            <button type="submit" name="register">Log in</button>
        </form>

        <h3>Change Password</h3>
        <form action="/changePass" method="POST" >
            <input type="text" name="username">username</input>
            <input type="password" name="oldPassword">Old password</input>
            <input type="password" name="newPassword">New password</input>
            <button type="submit" name="register">Log in</button>
        </form>

        <h3>Change username</h3>
        <form action="/changeName" method="POST" >
            <input type="text" name="oldUsername">Old username</input>
            <input type="text" name="newUsername">New username</input>
            <input type="password" name="password">password</input>
            <button type="submit" name="register">Log in</button>
        </form>


    </body>
</html>
