<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Flux Labs</title>
    </head>
    <body>
        <!-- note: 
         Lagyan nyo ng design ng design na mag mumukhan landing page (konting infographic , and etc......) para mag mukhang infographics talaga.
          ------------------------------------------------>
        

        <!-- Log in, sign up, change password, change username ------------------------------------------------>
        <!-- note: 
         Di na iseeseparate files yung mga code sa loob nito, gawan nyo nalang ng interface na pinapaita sila one at a time.
          ------------------------------------------------>
        <h3>Registration form</h3>
        <form action="/register" method="POST" >
            <input type="text" name="username">username</input>
            <input type="text" name="email">Email</input>
            <input type="text" name="phone_number">Phone Number</input>
            <input type="password" name="password">password</input>
            <button type="submit" name="register">Register</button>
        </form>

        <h3>Log in form</h3>
        <form action="/login" method="POST" >
            <input type="text" name="username">username</input>
            <input type="password" name="password">password</input>
            <button type="submit" name="register">Log in</button>
        </form>

        <!-- Changing password ------------------------------------------------>
        <h3>Verify username first</h3>
        <form action="/forgotPass" method="POST" >
            <input type="text" name="username">Enter your username</input>
            <button type="submit" name="verify">Send Code</button>
        </form>

        <h3>Change Password</h3>
        <form action="/changePass" method="POST" >
            <input type="text" name="username">Enter your username</input>
            <input type="text" name="code">Enter your code</input>
            <input type="password" name="newPassword">New password</input>
            <button type="submit" name="register">Change Password</button>
        </form>
        <!-- Changing password ------------------------------------------------>

        <h3>Change username</h3>
        <form action="/changeName" method="POST" >
            <input type="text" name="oldUsername">Old username</input>
            <input type="text" name="newUsername">New username</input>
            <input type="password" name="password">password</input>
            <button type="submit" name="register">Log in</button>
        </form>


    </body>
</html>
